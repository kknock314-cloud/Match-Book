<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#0c4a6e"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon-192.png"/>
<title>Exchange Book</title>
<style>
:root{--bg:#0b1220;--card:#111827;--line:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--green:#4ade80;--red:#f87171}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px}
.header{position:sticky;top:0;z-index:30;background:#0f172a;border-bottom:1px solid var(--line);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.header h1{font-size:.9rem;color:#7dd3fc}
.btn{border:none;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.7rem;cursor:pointer}
.btn-ghost{background:#1e293b;color:var(--text);border:1px solid var(--line)}
.btn-primary{background:linear-gradient(135deg,#0284c7,#38bdf8);color:#082f49;width:100%;padding:10px;font-size:.85rem;margin-top:6px}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.btn-sm{padding:5px 8px;font-size:.7rem}
.btn-back{background:#0c4a6e;color:#bae6fd;border:1.5px solid #0369a1}
.btn-lay{background:#4a1528;color:#fbcfe8;border:1.5px solid #9d174d}
.on-back{background:#0284c7!important;color:#fff!important;border-color:#7dd3fc!important}
.on-lay{background:#db2777!important;color:#fff!important;border-color:#f9a8d4!important}
.on-team{background:#1e3a5f!important;color:#fff!important;border-color:#38bdf8!important}
.wrap{max-width:520px;margin:0 auto;padding:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.card h2{font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.team{background:#0f172a;border-radius:8px;padding:6px 4px;text-align:center;border:1px solid var(--line)}
.name{font-size:.72rem;font-weight:800;padding:2px 6px;border-radius:5px;display:inline-block}
.name-t1{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#eff6ff}
.name-t2{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fffbeb}
.pl{font-size:1.05rem;font-weight:800;margin-top:2px}
.pos{color:var(--green)}.neg{color:var(--red)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.meta .box{background:#0f172a;border-radius:8px;padding:6px;border:1px solid var(--line)}
.lab{font-size:.6rem;color:var(--muted);text-transform:uppercase}
.val{font-size:.9rem;font-weight:700;margin-top:1px}
label{display:block;font-size:.6rem;color:var(--muted);margin-bottom:2px;text-transform:uppercase}
input{width:100%;padding:7px 8px;border-radius:8px;border:1.5px solid var(--line);background:#0f172a;color:var(--text);font-size:.85rem;outline:none}
input:focus{border-color:#38bdf8}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:4px 0 6px}
.seg button,.mini{padding:8px 6px;border-radius:8px;font-weight:800;font-size:.78rem;cursor:pointer;border:1.5px solid var(--line);background:#0f172a;color:var(--muted)}
.entry{background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px;font-size:.82rem}
.entry-top{display:flex;justify-content:space-between;font-size:.65rem;color:var(--muted);margin-bottom:4px}
.badge{padding:2px 6px;border-radius:5px;font-weight:700;font-size:.65rem}
.badge.back{background:#0c4a6e;color:#7dd3fc}.badge.lay{background:#9d174d;color:#fbcfe8}
.entry-actions{display:flex;gap:6px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:12px;font-size:.8rem}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#111827;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:14px;max-height:85vh;overflow-y:auto}
.hint{font-size:.65rem;color:var(--muted)}
</style>
</head>
<body>
<div class="header">
  <h1>Exchange Book</h1>
  <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
    <button class="btn btn-ghost btn-sm" onclick="openHistory()">History</button>
    <button class="btn btn-ghost btn-sm" onclick="newMatch()">New Match</button>
    <button class="btn btn-ghost btn-sm" onclick="openMatch()">Match</button>
  </div>
</div>
<div class="wrap">
  <!-- Match -->
  <div class="card">
    <h2 id="matchTitle">Match Odds</h2>
    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:4px;align-items:stretch">
      <div class="team">
        <div class="name name-t1" id="t1Name">Team 1</div>
        <div class="pl" id="t1PL">0</div>
      </div>
      <div style="background:#0f172a;border:1px solid var(--line);border-radius:8px;padding:4px 6px;text-align:center;min-width:70px;display:flex;flex-direction:column;justify-content:center">
        <div style="font-size:.55rem;color:var(--muted)">AVG ODD</div>
        <div id="avgOddLine" style="font-size:.68rem;font-weight:700;color:#7dd3fc;line-height:1.2">—</div>
      </div>
      <div class="team">
        <div class="name name-t2" id="t2Name">Team 2</div>
        <div class="pl" id="t2PL">0</div>
      </div>
    </div>

  </div>

  <!-- Cashout -->
  <div class="card">
    <div class="row" style="margin-bottom:6px">
      <div style="background:#9f1239;border-radius:8px;padding:7px;text-align:center">
        <div style="font-size:.6rem;color:#fecdd3;font-weight:700">CASHOUT</div>
        <div id="coAmount" style="font-size:.9rem;font-weight:800;color:#fff">—</div>
        <div id="coSub" style="font-size:.55rem;color:#fda4af"></div>
      </div>
      <div style="background:#15803d;border-radius:8px;padding:7px;text-align:center">
        <div style="font-size:.6rem;color:#bbf7d0;font-weight:700">LOSS CUT</div>
        <div id="lcAmount" style="font-size:.9rem;font-weight:800;color:#fff">—</div>
        <div id="lcSub" style="font-size:.55rem;color:#86efac"></div>
      </div>
    </div>
    <div class="row">
      <div><label id="cT1Lab">T1 odds</label><input type="number" id="cLay1" placeholder="1.60" step="0.01" inputmode="decimal" oninput="calcCashout()"/></div>
      <div><label id="cT2Lab">T2 odds</label><input type="number" id="cLay2" placeholder="1.68" step="0.01" inputmode="decimal" oninput="calcCashout()"/></div>
    </div>
  </div>

  <!-- Quick Calc — ONE only -->
  <div class="card">
    <h2>Quick Calc</h2>
    <div class="row3">
      <button type="button" id="qcLay" class="btn-lay on-lay mini" onclick="setQc('LAY')">LAY</button>
      <button type="button" id="qcBack" class="btn-back mini" onclick="setQc('BACK')">BACK</button>
      <button type="button" class="mini" onclick="qcCopy()" style="background:#059669;color:#fff;border:none">
        <div style="font-size:.5rem" id="qcResultLab">AMOUNT</div>
        <div id="qcResult" style="font-size:.8rem;font-weight:800">—</div>
      </button>
    </div>
    <div class="row" style="margin-top:4px">
      <div><label id="qcOddsLab">Odds (40=1.40)</label><input type="number" id="qcOdds" placeholder="40" inputmode="decimal" oninput="qcCalc()"/></div>
      <div><label id="qcRiskLab">Risk</label><input type="number" id="qcRisk" placeholder="6000" inputmode="numeric" oninput="qcCalc()"/></div>
    </div>
  </div>

  <!-- Add Bet -->
  <div class="card">
    <h2>Add Bet</h2>
    <label>Side</label>
    <div class="seg">
      <button type="button" id="btnBack" class="btn-back on-back" onclick="setSide('BACK')">BACK</button>
      <button type="button" id="btnLay" class="btn-lay" onclick="setSide('LAY')">LAY</button>
    </div>
    <label>Team</label>
    <div class="seg">
      <button type="button" id="btnT1" class="btn-ghost on-team" onclick="setTeam(1)">Team 1</button>
      <button type="button" id="btnT2" class="btn-ghost" onclick="setTeam(2)">Team 2</button>
    </div>
    <div class="row">
      <div><label>Odds</label><input type="number" id="odds" placeholder="2.42" step="0.01" inputmode="decimal" oninput="updateLiab()"/></div>
      <div><label>Stake</label><input type="number" id="stake" placeholder="1000" inputmode="numeric" oninput="updateLiab()"/></div>
    </div>
    <div id="livePreview" class="hint" style="margin-top:4px;display:none"></div>
    <button class="btn btn-primary" id="saveBtn" onclick="saveBet()">Add Bet</button>
  </div>

  <div class="card">
    <h2>Bet History</h2>
    <div id="history"><div class="empty">Koi bet nahi</div></div>
  </div>
</div>

<div class="modal-bg" id="historyModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h2 style="color:#7dd3fc;margin:0">Match History</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeHistory()">Close</button>
    </div>
    <div id="archiveList"><div class="empty">Koi old match nahi</div></div>
  </div>
</div>

<div class="modal-bg" id="matchModal">
  <div class="modal">
    <h2 style="color:#7dd3fc;margin-bottom:10px">Match Setup</h2>
    <div style="margin-bottom:8px"><label>Title</label><input id="series" value="MATCH ODDS" readonly style="opacity:.7;pointer-events:none"/></div>
    <div class="row">
      <div><label>Team 1</label><input id="inT1" placeholder="e.g. India" value=""/></div>
      <div><label>Team 2</label><input id="inT2" placeholder="e.g. New Zealand" value=""/></div>
    </div>
    <button class="btn btn-primary" onclick="saveMatch()">Save</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:6px" onclick="closeMatch()">Cancel</button>
  </div>
</div>

<script>
const KEY='exchange_book_v4';
let state={series:'MATCH ODDS',team1:'',team2:'',bets:[],editId:null,archive:[]};
let side='BACK',team=1,qcMode='LAY';

function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);state={...state,...d};if(!state.archive)state.archive=[];if(!state.bets)state.bets=[];}}catch(e){}
  if(state.team1==='Team 1') state.team1='';
  if(state.team2==='Team 2') state.team2='';
  render();}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));}
function fmt(n){return(Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:2});}
function fmtTime(iso){try{return new Date(iso).toLocaleString('en-IN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});}catch(e){return'';}}

function setSide(s){side=s;document.getElementById('btnBack').className=s==='BACK'?'btn-back on-back':'btn-back';document.getElementById('btnLay').className=s==='LAY'?'btn-lay on-lay':'btn-lay';updateLiab();}
function setTeam(n){team=n;document.getElementById('btnT1').className=n===1?'btn-ghost on-team':'btn-ghost';document.getElementById('btnT2').className=n===2?'btn-ghost on-team':'btn-ghost';updateLiab();}

function plForBet(odds,stake,side,teamNo){
  const o=+odds,s=+stake;let t1=0,t2=0;
  if(side==='BACK'){if(teamNo===1){t1=s*(o-1);t2=-s;}else{t2=s*(o-1);t1=-s;}}
  else{const liab=s*(o-1);if(teamNo===1){t1=-liab;t2=s;}else{t2=-liab;t1=s;}}
  return{t1:Math.round(t1*100)/100,t2:Math.round(t2*100)/100};
}

function updateLiab(){
  const o=parseFloat(document.getElementById('odds').value),s=parseFloat(document.getElementById('stake').value);
  const box=document.getElementById('livePreview');
  if(!(o>1&&s>0)){box.style.display='none';return;}
  box.style.display='block';
  const tn=team===1?state.team1:state.team2,ot=team===1?state.team2:state.team1;
  if(side==='BACK') box.innerHTML='<b>BACK '+tn+'</b> · Win <span class="pos">+'+fmt(s*(o-1))+'</span> · Lose <span class="neg">−'+fmt(s)+'</span>';
  else box.innerHTML='<b>LAY '+tn+'</b> · Liab <span class="neg">'+fmt(s*(o-1))+'</span> · If other wins <span class="pos">+'+fmt(s)+'</span>';
}

function saveBet(){
  const odds=parseFloat(document.getElementById('odds').value),stake=parseFloat(document.getElementById('stake').value);
  if(!odds||odds<=1||!stake||stake<=0){alert('Odds > 1 aur Stake > 0');return;}
  const pl=plForBet(odds,stake,side,team);
  const bet={id:state.editId||(Date.now()+Math.random().toString(16).slice(2)),side,team,odds,stake,t1:pl.t1,t2:pl.t2,time:new Date().toISOString()};
  if(state.editId){const i=state.bets.findIndex(b=>b.id===state.editId);if(i>=0){bet.time=state.bets[i].time;state.bets[i]=bet;}state.editId=null;document.getElementById('saveBtn').textContent='Add Bet';}
  else state.bets.unshift(bet);
  persist();document.getElementById('odds').value='';document.getElementById('stake').value='';updateLiab();render();
}
function editBet(id){const b=state.bets.find(x=>x.id===id);if(!b)return;state.editId=id;setSide(b.side);setTeam(b.team);document.getElementById('odds').value=b.odds;document.getElementById('stake').value=b.stake;document.getElementById('saveBtn').textContent='Update Bet';updateLiab();window.scrollTo({top:0,behavior:'smooth'});}
function delBet(id){if(!confirm('Delete?'))return;state.bets=state.bets.filter(b=>b.id!==id);if(state.editId===id){state.editId=null;document.getElementById('saveBtn').textContent='Add Bet';}persist();render();}
function totals(){let t1=0,t2=0;state.bets.forEach(b=>{t1+=b.t1;t2+=b.t2;});return{t1:Math.round(t1*100)/100,t2:Math.round(t2*100)/100};}

function calcCashout(){
  const{t1,t2}=totals();const o1=parseFloat(document.getElementById('cLay1').value),o2=parseFloat(document.getElementById('cLay2').value);
  const coM=document.getElementById('coAmount'),coS=document.getElementById('coSub'),lcM=document.getElementById('lcAmount'),lcS=document.getElementById('lcSub');
  coM.textContent='—';lcM.textContent='—';coS.textContent='';lcS.textContent='';
  if(Math.abs(t1-t2)<0.01){coM.textContent=fmt(t1);coS.textContent='balanced';lcM.textContent=fmt(Math.min(t1,t2));lcS.textContent='risk ok';return;}
  const highIs1=t1>t2,highName=highIs1?state.team1:state.team2,lowName=highIs1?state.team2:state.team1;
  const tHigh=highIs1?t1:t2,tLow=highIs1?t2:t1,oHigh=highIs1?o1:o2,oLow=highIs1?o2:o1;
  document.getElementById('cT1Lab').textContent=highIs1?state.team1+' Lay':state.team1+' Back';
  document.getElementById('cT2Lab').textContent=highIs1?state.team2+' Back':state.team2+' Lay';
  if(oHigh>1){const s=(tHigh-tLow)/oHigh,locked=tLow+s;coM.textContent=fmt(locked);coS.textContent='LAY '+highName+' '+fmt(s);}
  else if(oLow>1){const s=(tHigh-tLow)/oLow,locked=tHigh-s;coM.textContent=fmt(locked);coS.textContent='BACK '+lowName+' '+fmt(s);}
  else coS.textContent='odds daalo';
  if(tLow>=0){lcM.textContent=fmt(tLow);lcS.textContent='already 0 risk';}
  else if(oHigh>1){const s=-tLow,remain=tHigh-s*(oHigh-1);lcM.textContent=fmt(remain);lcS.textContent='LAY '+highName+' '+fmt(s);}
  else if(oLow>1){const s=(-tLow)/(oLow-1),remain=tHigh-s;lcM.textContent=fmt(remain);lcS.textContent='BACK '+lowName+' '+fmt(s);}
  else lcS.textContent='odds daalo';
}

function setQc(m){
  qcMode=m;
  document.getElementById('qcLay').className=m==='LAY'?'btn-lay on-lay mini':'btn-lay mini';
  document.getElementById('qcBack').className=m==='BACK'?'btn-back on-back mini':'btn-back mini';
  document.getElementById('qcOddsLab').textContent=m==='LAY'?'Odds (40=1.40)':'Odds (1.40)';
  document.getElementById('qcRiskLab').textContent=m==='LAY'?'Risk':'Stake';
  document.getElementById('qcResultLab').textContent=m==='LAY'?'AMOUNT':'PROFIT';
  qcCalc();
}
function qcCalc(){
  const raw=parseFloat(document.getElementById('qcOdds').value),risk=parseFloat(document.getElementById('qcRisk').value);
  const res=document.getElementById('qcResult');
  if(!raw||raw<=0||!risk||risk<=0){res.textContent='—';return;}
  if(qcMode==='LAY'){const excess=raw/100;if(excess<=0){res.textContent='—';return;}res.textContent=fmt(risk/excess);}
  else{if(raw<=1){res.textContent='—';return;}res.textContent=fmt(risk*(raw-1));}
}
function qcCopy(){const t=document.getElementById('qcResult').textContent;if(t&&t!=='—'&&navigator.clipboard)navigator.clipboard.writeText(t.replace(/,/g,'')).catch(()=>{});}

function archiveCurrent(){
  if(!state.bets.length)return;
  const{t1,t2}=totals();
  state.archive.unshift({id:Date.now()+Math.random().toString(16).slice(2),series:state.series,team1:state.team1,team2:state.team2,bets:JSON.parse(JSON.stringify(state.bets)),t1,t2,savedAt:new Date().toISOString()});
  if(state.archive.length>50)state.archive=state.archive.slice(0,50);
}
function newMatch(){
  if(state.bets.length){if(!confirm('Current match History me save hoga. Continue?'))return;archiveCurrent();}
  state.bets=[];state.editId=null;
  state.series='MATCH ODDS';
  state.team1='';
  state.team2='';
  persist();
  ['cLay1','cLay2','odds','stake','qcOdds','qcRisk'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  document.getElementById('saveBtn').textContent='Add Bet';
  openMatch();
  render();
}
function openArchiveMatch(id){
  const m=state.archive.find(x=>x.id===id);if(!m)return;
  if(state.bets.length){if(!confirm('Current save hoga, old open?'))return;archiveCurrent();}
  state.series=m.series;state.team1=m.team1;state.team2=m.team2;state.bets=JSON.parse(JSON.stringify(m.bets));state.editId=null;persist();closeHistory();render();
}
function deleteArchive(id){if(!confirm('Delete?'))return;state.archive=state.archive.filter(x=>x.id!==id);persist();renderArchiveOnly();}
function openHistory(){renderArchiveOnly();document.getElementById('historyModal').classList.add('open');}
function closeHistory(){document.getElementById('historyModal').classList.remove('open');}
function renderArchiveOnly(){
  const arch=document.getElementById('archiveList');
  if(!state.archive.length){arch.innerHTML='<div class="empty">Koi old match nahi</div>';return;}
  arch.innerHTML=state.archive.map(m=>`<div class="entry"><div class="entry-top"><span>${fmtTime(m.savedAt)}</span><span class="badge back">${(m.bets||[]).length} bets</span></div>
    <div><b>${m.series||'Match'}</b><br>${m.team1} <span class="${m.t1>=0?'pos':'neg'}">${fmt(m.t1)}</span> · ${m.team2} <span class="${m.t2>=0?'pos':'neg'}">${fmt(m.t2)}</span></div>
    <div class="entry-actions"><button class="btn btn-ghost btn-sm" onclick="openArchiveMatch('${m.id}')">Open</button>
    <button class="btn btn-danger btn-sm" onclick="deleteArchive('${m.id}')">Delete</button></div></div>`).join('');
}

function render(){
  document.getElementById('matchTitle').textContent=state.series||'MATCH ODDS';
  document.getElementById('t1Name').textContent=state.team1||'Team 1';
  document.getElementById('t2Name').textContent=state.team2||'Team 2';
  document.getElementById('btnT1').textContent=state.team1||'Team 1';
  document.getElementById('btnT2').textContent=state.team2||'Team 2';
  const{t1,t2}=totals();
  const e1=document.getElementById('t1PL'),e2=document.getElementById('t2PL');
  e1.textContent=fmt(t1);e2.textContent=fmt(t2);
  e1.className='pl '+(t1>=0?'pos':'neg');e2.className='pl '+(t2>=0?'pos':'neg');
  
  const avgEl=document.getElementById('avgOddLine');
  if(Math.abs(t1-t2)<0.01)avgEl.textContent='Balanced';
  else{
    let opts=[];
    if(t1>t2){if(t2<0)opts.push({n:state.team1,s:'Lay',o:(t1-t2)/(-t2)});if(t1>0)opts.push({n:state.team2,s:'Back',o:(t1-t2)/t1});}
    else{if(t1<0)opts.push({n:state.team2,s:'Lay',o:(t2-t1)/(-t1)});if(t2>0)opts.push({n:state.team1,s:'Back',o:(t2-t1)/t2});}
    opts=opts.filter(x=>x.o>1.01&&x.o<100).sort((a,b)=>a.o-b.o);
    avgEl.textContent=opts.length?opts[0].n+' · '+opts[0].s+' @ '+opts[0].o.toFixed(2):'—';
  }
  calcCashout();
  const box=document.getElementById('history');
  if(!state.bets.length)box.innerHTML='<div class="empty">Koi bet nahi</div>';
  else box.innerHTML=state.bets.map(b=>{
    const tn=b.team===1?state.team1:state.team2;
    return`<div class="entry"><div class="entry-top"><span>${fmtTime(b.time)}</span><span class="badge ${b.side==='BACK'?'back':'lay'}">${b.side}</span></div>
      <div><b>${tn}</b> @ ${b.odds} · ${fmt(b.stake)}${b.side==='LAY'?' · Liab '+fmt(b.stake*(b.odds-1)):''}<br>
      ${state.team1}: <span class="${b.t1>=0?'pos':'neg'}">${fmt(b.t1)}</span> · ${state.team2}: <span class="${b.t2>=0?'pos':'neg'}">${fmt(b.t2)}</span></div>
      <div class="entry-actions"><button class="btn btn-ghost btn-sm" onclick="editBet('${b.id}')">Edit</button>
      <button class="btn btn-danger btn-sm" onclick="delBet('${b.id}')">Delete</button></div></div>`;
  }).join('');
}
function openMatch(){
  document.getElementById('series').value='MATCH ODDS';
  const t1=document.getElementById('inT1');
  const t2=document.getElementById('inT2');
  t1.value = state.team1 ? state.team1 : '';
  t2.value = state.team2 ? state.team2 : '';
  // never show default Team 1 / Team 2 as value
  if(t1.value==='Team 1') t1.value='';
  if(t2.value==='Team 2') t2.value='';
  document.getElementById('matchModal').classList.add('open');
  setTimeout(()=>{t1.focus();},200);
}
function closeMatch(){document.getElementById('matchModal').classList.remove('open');}
function saveMatch(){
  state.series='MATCH ODDS';
  const t1=document.getElementById('inT1').value.trim();
  const t2=document.getElementById('inT2').value.trim();
  if(!t1||!t2){alert('Dono team names daalo');return;}
  state.team1=t1;state.team2=t2;
  persist();closeMatch();render();
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
load();
</script>
</body>
